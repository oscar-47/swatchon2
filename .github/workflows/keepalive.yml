name: Keep HF Space awake

# Pings the live demo so the free-tier Hugging Face Space never hits the
# 15-minute idle sleep window. 5 minutes is the shortest cron resolution
# GitHub Actions supports, so this fires 288 times/day (well inside the
# free public-repo budget). The schedule runs around the clock to keep
# the exhibition demo instantly responsive — no warm-up wait at booth.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Curl the live demo
        run: |
          for path in / /passport_v2 /assistant /fabricai/api/config; do
            echo "GET https://turbosun-fabricflow-demo.hf.space$path"
            curl -fsS -o /dev/null -w "  HTTP %{http_code}  %{time_total}s\n" \
              --max-time 30 --retry 2 --retry-delay 5 \
              "https://turbosun-fabricflow-demo.hf.space$path" || true
          done
