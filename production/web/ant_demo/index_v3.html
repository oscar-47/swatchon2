<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fabric Classification Demov3 | Complete Metadata System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5/dist/reset.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5/dist/antd.min.css" />
  <style>
    :root { --brand:#7a5cff; --brand2:#00d4ff; }
    body { margin: 0; padding: 0; background: #0f1220; }
    .container { width: min(1600px, 96vw); margin: 0 auto; }
    .hero { background: radial-gradient(1200px 400px at 20% -10%, rgba(122,92,255,.35), transparent 60%), radial-gradient(1000px 380px at 90% 0%, rgba(0,212,255,.25), transparent 60%), linear-gradient(180deg, #101428, #0f1220); padding: 48px 0 36px; color: #fff; }
    .hero .title { margin: 0 0 8px; font-size: 34px; letter-spacing: .3px; }
    .hero .subtitle { margin: 0 0 20px; color: rgba(255,255,255,.75); }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .layout { padding: 24px 0 36px; }
    .panel { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); padding: 20px; }
    .upload-zone { border: 2px dashed #d9d9d9; border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: all .3s; }
    .upload-zone:hover { border-color: #7a5cff; background: #fafafa; }
    .upload-zone.has-file { border-color: #52c41a; background: #f6ffed; }
    .preview-img { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 12px; }
    .metadata-card { background: #fafafa; border-radius: 8px; padding: 16px; margin-top: 16px; }
    .metadata-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .metadata-item:last-child { border-bottom: none; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 20px 0; }
    .footer { margin-top: 40px; color: rgba(255,255,255,.6); text-align: center; font-size: 12px; }
    @media (max-width: 1024px) { .grid3 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
  <script src="https://unpkg.com/antd@5.12.0/dist/antd.min.js"></script>
  <script>
  const { useState, useEffect } = React;
  const { ConfigProvider, App: AntApp, Typography, Select, Button, Card, Tag, Space, message, Divider, Upload, Descriptions, Alert, Spin, Progress, Switch } = antd;
  const { Title, Text, Paragraph } = Typography;

  function App() {
    const [dark, setDark] = useState(false);
    
    // 三张图片的状态
    const [fabricFile, setFabricFile] = useState(null);
    const [fabricPreview, setFabricPreview] = useState(null);
    const [labelFile, setLabelFile] = useState(null);
    const [labelPreview, setLabelPreview] = useState(null);
    const [backFile, setBackFile] = useState(null);
    const [backPreview, setBackPreview] = useState(null);
    
    const [loading, setLoading] = useState(false);
    const [metadata, setMetadata] = useState(null);

    // Automatic 2-stage classification - no model selection needed

    function handleFileUpload(file, type) {
      const reader = new FileReader();
      reader.onload = (e) => {
        if (type === 'fabric') {
          setFabricFile(file);
          setFabricPreview(e.target.result);
        } else if (type === 'label') {
          setLabelFile(file);
          setLabelPreview(e.target.result);
        } else if (type === 'back') {
          setBackFile(file);
          setBackPreview(e.target.result);
        }
      };
      reader.readAsDataURL(file);
      return false; // 阻止自动上传
    }

    async function createMetadata() {
      if (!fabricFile) {
        message.warning('Please upload fabric image');
        return;
      }

      setLoading(true);
      try {
        const fd = new FormData();
        fd.append('fabric_image', fabricFile);
        if (labelFile) fd.append('label_image', labelFile);
        if (backFile) fd.append('back_image', backFile);

        const resp = await fetch('/api/create_metadata', { method: 'POST', body: fd });
        const data = await resp.json();
        
        if (data.success) {
          setMetadata(data.metadata);
          message.success('Metadata created successfully!');
        } else {
          message.error(data.message || 'Failed to create metadata');
        }
      } catch (e) {
        console.error(e);
        message.error('Request failed: ' + e.message);
      } finally {
        setLoading(false);
      }
    }

    function clearAll() {
      setFabricFile(null);
      setFabricPreview(null);
      setLabelFile(null);
      setLabelPreview(null);
      setBackFile(null);
      setBackPreview(null);
      setMetadata(null);
    }

    function downloadMetadata() {
      if (!metadata) return;
      const json = JSON.stringify(metadata, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fabric_metadata_${metadata.fabric_id}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    return React.createElement(ConfigProvider, { 
      componentSize: 'large', 
      theme: { 
        algorithm: dark ? antd.theme.darkAlgorithm : antd.theme.defaultAlgorithm, 
        token: { fontSize: 16, borderRadius: 10, colorPrimary: '#7a5cff' } 
      } 
    },
      React.createElement(AntApp, null,
        React.createElement('div', { className: 'hero' },
          React.createElement('div', { className: 'container' },
            React.createElement(Title, { className: 'title', style: { color:'#fff', margin: '0 0 8px' } }, 'Fabric Metadata Generator V3'),
            React.createElement(Paragraph, { className: 'subtitle' }, '2-Stage Classification + OCR + Double Verification'),
            React.createElement('div', { className: 'actions' },
              React.createElement(Button, { 
                type: 'primary', 
                onClick: createMetadata, 
                loading, 
                disabled: !fabricFile,
                size: 'large'
              }, 'Generate Metadata'),
              React.createElement(Button, { onClick: clearAll }, 'Clear All'),
              React.createElement(Button, { onClick: downloadMetadata, disabled: !metadata }, 'Download JSON'),
              React.createElement(Space, { style: { marginLeft: 'auto' } },
                React.createElement(Text, { style: { color: '#fff' } }, 'Dark Mode'),
                React.createElement(antd.Switch, { checked: dark, onChange: setDark })
              )
            )
          )
        ),

        React.createElement('div', { className: 'container layout' },
          // 上传区域
          React.createElement('div', { className: 'panel' },
            React.createElement(Title, { level: 4 }, '📤 Upload Images'),
            React.createElement(Alert, {
              message: 'Upload Instructions',
              description: 'Fabric image is required. Label and back images are optional but recommended for complete metadata.',
              type: 'info',
              showIcon: true,
              style: { marginBottom: 20 }
            }),
            
            React.createElement('div', { className: 'grid3' },
              // 布料正面
              React.createElement('div', null,
                React.createElement(Text, { strong: true }, '1️⃣ Fabric Front (Required)'),
                React.createElement('div', { 
                  className: `upload-zone ${fabricPreview ? 'has-file' : ''}`,
                  onClick: () => document.getElementById('fabric-input').click()
                },
                  fabricPreview ? 
                    React.createElement('img', { src: fabricPreview, className: 'preview-img', alt: 'fabric' })
                    : React.createElement('div', null,
                      React.createElement('div', { style: { fontSize: 48 } }, '🧵'),
                      React.createElement('div', null, 'Click to upload fabric image')
                    )
                ),
                React.createElement('input', {
                  id: 'fabric-input',
                  type: 'file',
                  accept: 'image/*',
                  style: { display: 'none' },
                  onChange: (e) => e.target.files[0] && handleFileUpload(e.target.files[0], 'fabric')
                })
              ),

              // 标签
              React.createElement('div', null,
                React.createElement(Text, { strong: true }, '2️⃣ Label (Optional)'),
                React.createElement('div', { 
                  className: `upload-zone ${labelPreview ? 'has-file' : ''}`,
                  onClick: () => document.getElementById('label-input').click()
                },
                  labelPreview ? 
                    React.createElement('img', { src: labelPreview, className: 'preview-img', alt: 'label' })
                    : React.createElement('div', null,
                      React.createElement('div', { style: { fontSize: 48 } }, '🏷️'),
                      React.createElement('div', null, 'Click to upload label image')
                    )
                ),
                React.createElement('input', {
                  id: 'label-input',
                  type: 'file',
                  accept: 'image/*',
                  style: { display: 'none' },
                  onChange: (e) => e.target.files[0] && handleFileUpload(e.target.files[0], 'label')
                })
              ),

              // 布料反面
              React.createElement('div', null,
                React.createElement(Text, { strong: true }, '3️⃣ Fabric Back (Optional)'),
                React.createElement('div', { 
                  className: `upload-zone ${backPreview ? 'has-file' : ''}`,
                  onClick: () => document.getElementById('back-input').click()
                },
                  backPreview ? 
                    React.createElement('img', { src: backPreview, className: 'preview-img', alt: 'back' })
                    : React.createElement('div', null,
                      React.createElement('div', { style: { fontSize: 48 } }, '🔄'),
                      React.createElement('div', null, 'Click to upload back side')
                    )
                ),
                React.createElement('input', {
                  id: 'back-input',
                  type: 'file',
                  accept: 'image/*',
                  style: { display: 'none' },
                  onChange: (e) => e.target.files[0] && handleFileUpload(e.target.files[0], 'back')
                })
              )
            )
          ),

          // 结果显示
          loading ? React.createElement('div', { className: 'panel', style: { textAlign: 'center', padding: 60 } },
            React.createElement(Spin, { size: 'large', tip: 'Generating metadata...' })
          ) : null,

          metadata ? React.createElement('div', { className: 'panel', style: { marginTop: 20 } },
            React.createElement(Title, { level: 4 }, '📊 Generated Metadata'),
            
            // 结构信息
            React.createElement(Card, { 
              title: '🧬 Fabric Structure (from Image Model)', 
              style: { marginTop: 16 },
              extra: React.createElement(Tag, { color: 'blue' }, `${(metadata.structure.confidence * 100).toFixed(1)}% confidence`)
            },
              React.createElement(Descriptions, { bordered: true, column: 2 },
                React.createElement(Descriptions.Item, { label: 'Primary Type' }, metadata.structure.primary),
                React.createElement(Descriptions.Item, { label: 'Secondary Type' }, 
                  React.createElement(Tag, { color: 'geekblue', style: { fontSize: 14 } }, metadata.structure.secondary)
                ),
                React.createElement(Descriptions.Item, { label: 'Model Version', span: 2 }, metadata.structure.model_version)
              ),
              metadata.structure.all_probabilities ? React.createElement('div', { style: { marginTop: 16 } },
                React.createElement(Text, { strong: true }, 'All Predictions:'),
                React.createElement('div', { style: { marginTop: 8 } },
                  Object.entries(metadata.structure.all_probabilities).map(([cls, prob]) =>
                    React.createElement('div', { key: cls, style: { marginBottom: 8 } },
                      React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', marginBottom: 4 } },
                        React.createElement(Text, null, cls),
                        React.createElement(Text, { type: 'secondary' }, `${(prob * 100).toFixed(1)}%`)
                      ),
                      React.createElement(Progress, { percent: prob * 100, showInfo: false, size: 'small' })
                    )
                  )
                )
              ) : null
            ),

            // 规格信息（OCR）
            metadata.specifications && Object.values(metadata.specifications).some(v => v) ? 
              React.createElement(Card, { 
                title: '📋 Specifications (from OCR)', 
                style: { marginTop: 16 },
                extra: metadata.ocr_confidence ? React.createElement(Tag, { color: 'green' }, `OCR: ${(metadata.ocr_confidence * 100).toFixed(0)}%`) : null
              },
                React.createElement(Descriptions, { bordered: true, column: 2 },
                  metadata.specifications.composition ? React.createElement(Descriptions.Item, { label: 'Composition' }, metadata.specifications.composition) : null,
                  metadata.specifications.weight ? React.createElement(Descriptions.Item, { label: 'Weight' }, metadata.specifications.weight) : null,
                  metadata.specifications.pattern ? React.createElement(Descriptions.Item, { label: 'Pattern' }, 
                    React.createElement(Tag, { color: 'orange' }, metadata.specifications.pattern)
                  ) : null,
                  metadata.specifications.width ? React.createElement(Descriptions.Item, { label: 'Width' }, metadata.specifications.width) : null,
                  metadata.specifications.thickness ? React.createElement(Descriptions.Item, { label: 'Thickness' }, metadata.specifications.thickness) : null,
                  metadata.specifications.sustainability ? React.createElement(Descriptions.Item, { label: 'Sustainability' }, 
                    React.createElement(Tag, { color: 'green' }, metadata.specifications.sustainability)
                  ) : null,
                  metadata.specifications.origin ? React.createElement(Descriptions.Item, { label: 'Origin' }, metadata.specifications.origin) : null
                ),
                metadata.ocr_raw_text ? React.createElement('div', { style: { marginTop: 12, padding: 12, background: '#fafafa', borderRadius: 4 } },
                  React.createElement(Text, { type: 'secondary', style: { fontSize: 12 } }, 'Raw OCR Text: '),
                  React.createElement(Text, { style: { fontSize: 12 } }, metadata.ocr_raw_text)
                ) : null
              ) : null,

            // Double检测
            metadata.double_check && metadata.double_check.performed ? 
              React.createElement(Card, { 
                title: '🔄 Double Structure Verification', 
                style: { marginTop: 16 }
              },
                React.createElement(Alert, {
                  message: metadata.double_check.suggestion,
                  type: metadata.double_check.is_double_structure ? 'success' : 'info',
                  showIcon: true,
                  style: { marginBottom: 12 }
                }),
                React.createElement(Descriptions, { bordered: true, column: 2 },
                  React.createElement(Descriptions.Item, { label: 'Is Double Structure' }, 
                    metadata.double_check.is_double_structure ? 
                      React.createElement(Tag, { color: 'green' }, '✓ Yes') : 
                      React.createElement(Tag, { color: 'default' }, '✗ No')
                  ),
                  React.createElement(Descriptions.Item, { label: 'Similarity Score' }, 
                    `${(metadata.double_check.similarity_score * 100).toFixed(1)}%`
                  ),
                  React.createElement(Descriptions.Item, { label: 'Confidence Level', span: 2 }, 
                    React.createElement(Tag, { 
                      color: metadata.double_check.confidence_level === 'High' ? 'green' : 
                             metadata.double_check.confidence_level === 'Medium' ? 'orange' : 'default'
                    }, metadata.double_check.confidence_level)
                  )
                )
              ) : null,

            // 元信息
            React.createElement(Card, { title: '🆔 Metadata Info', style: { marginTop: 16 } },
              React.createElement(Descriptions, { bordered: true, column: 2 },
                React.createElement(Descriptions.Item, { label: 'Fabric ID' }, React.createElement(Tag, null, metadata.fabric_id)),
                React.createElement(Descriptions.Item, { label: 'Timestamp' }, metadata.timestamp)
              )
            )
          ) : null
        ),

        React.createElement('div', { className: 'footer container' }, 
          'Fabric Classification Demov3 - Complete Metadata System | Powered by ResNet50 + EasyOCR'
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
